name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Needs real network access to Prisma's engine CDN — this step
      # will fail in any sandbox that blocks that (see project notes),
      # but GitHub-hosted runners have unrestricted outbound access.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # --passWithNoTests: no .spec.ts files exist yet (see the RBAC
      # test matrix task). Once real tests land, this flag stops
      # mattering — Jest just finds and runs them normally, and a
      # real failure still fails the build as it should.
      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t medcore-api:ci ./apps/api
